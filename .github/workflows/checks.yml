# 이 저장소 자체의 검사. 다른 프로젝트용 템플릿은 templates/ci/에 있습니다.
# templates/ 아래는 자리표시 링크가 많아 문서 링크 검사에서만 뺍니다.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # PR의 커밋 제목을 기준 브랜치와 비교해 검사하려고 전체 기록을 받음
      - name: 검사 도구 자체 테스트
        run: python3 -I -m unittest discover -s templates/ci -p "test_*.py"
      - name: 동기화 도구 테스트
        run: python3 -I -m unittest discover -s scripts -p "test_*.py"
      - name: 저장소 규칙 검사
        env:
          # PR이면 기준 브랜치 이후의 커밋 제목을 검사합니다. 비어 있으면(푸시) 아직 원격에 없는 커밋만 봅니다.
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '' }}
        run: python3 -I templates/ci/repo_checks.py --docs-exclude templates --commits "$COMMIT_RANGE"

  # 훅과 도구는 Windows PC에서도 돕니다. 경로 구분자(\)와 한국어 출력 인코딩 문제는 Linux에서 드러나지 않아 따로 돌립니다.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 검사 도구 자체 테스트
        run: python -I -m unittest discover -s templates/ci -p "test_*.py"
      - name: 동기화 도구 테스트
        run: python -I -m unittest discover -s scripts -p "test_*.py"
