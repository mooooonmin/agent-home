# 프로젝트의 .github/workflows/docs.yml로 복사하고,
# check-doc-links.py는 scripts/check-doc-links.py로 복사합니다.
# 푸시와 PR마다 문서의 깨진 내부 링크·이미지·앵커를 잡아 병합을 막습니다.
name: docs

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 문서 내부 링크·이미지·앵커 검사
        run: python3 -I scripts/check-doc-links.py
